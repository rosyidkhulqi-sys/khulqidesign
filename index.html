<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khulqidesign: Icons, Vectors, Logos & Templates</title>
    <meta
      name="description"
      content="Download icons, vectors, logos, templates and stock footage, or edit them in your browser with Create and AI. Free to start."
    />
    <link rel="canonical" href="https://khulqidesign.com/" />
    <meta name="theme-color" content="#0a0b0d" />

    <!-- how the site looks when a link is shared -->
    <meta property="og:site_name" content="Khulqidesign" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khulqidesign.com/" />
    <meta property="og:title" content="Khulqidesign: Icons, Vectors, Logos & Templates" />
    <meta property="og:description" content="Download design assets, or edit them in your browser with Create and AI. Free to start." />
    <meta property="og:image" content="https://khulqidesign.com/preview1.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- the site name and logo search engines show -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Khulqidesign",
            "alternateName": ["Khulqi Design", "khulqidesign.com"],
            "url": "https://khulqidesign.com/"
          },
          {
            "@type": "Organization",
            "name": "Khulqidesign",
            "url": "https://khulqidesign.com/",
            "logo": "https://khulqidesign.com/logo1.png"
          }
        ]
      }
    </script>
    <!-- the plain page the server writes for crawlers (api/page.js,
         api/asset.js): tidy for the moment a visitor sees it before the app -->
    <style>
      #root > main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; color: #9aa0a6; font: 14px/1.5 system-ui, sans-serif; }
      #root > main h1 { color: #f5f5f5; font-size: 28px; margin: 0 0 8px; }
      #root > main ul { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 24px 0; padding: 0; list-style: none; }
      #root > main li a { color: inherit; font-size: 12px; text-decoration: none; }
      #root > main img { display: block; width: 100%; height: auto; max-width: 480px; aspect-ratio: auto; border-radius: 8px; background: #17191c; }
      #root > main nav a { color: #c9cdd2; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
